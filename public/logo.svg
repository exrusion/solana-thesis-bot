<svg viewBox="0 0 170 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pump Trade logo">
  <defs>
    <linearGradient id="casing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A5057"/>
      <stop offset="45%" stop-color="#2B3036"/>
      <stop offset="100%" stop-color="#171A1F"/>
    </linearGradient>
    <linearGradient id="greenFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#A8F5CD"/>
      <stop offset="45%" stop-color="#6EE7A8"/>
      <stop offset="100%" stop-color="#3FBF85"/>
    </linearGradient>
    <linearGradient id="darkFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#16202E"/>
      <stop offset="100%" stop-color="#080C13"/>
    </linearGradient>
    <linearGradient id="antenna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BF0BD"/>
      <stop offset="100%" stop-color="#4FA97C"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="40" y="50" width="80" height="120" rx="40"/>
    </clipPath>
    <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="rotate(18 85 110)">
    <!-- antenna + bottom stub -->
    <line x1="85" y1="46" x2="85" y2="16" stroke="url(#antenna)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="85" cy="12" r="9" fill="url(#antenna)"/>
    <circle cx="82" cy="9" r="3" fill="#FFFFFF" opacity="0.45"/>
    <line x1="85" y1="172" x2="85" y2="206" stroke="url(#antenna)" stroke-width="8" stroke-linecap="round"/>

    <!-- outer casing -->
    <rect x="30" y="40" width="110" height="140" rx="55" fill="url(#casing)"/>
    <rect x="34" y="44" width="102" height="132" rx="51" fill="none" stroke="#0B0E14" stroke-width="2" opacity="0.5"/>

    <!-- inner two-tone body -->
    <g clip-path="url(#innerClip)">
      <rect x="40" y="50" width="80" height="60" fill="url(#greenFace)"/>
      <rect x="40" y="110" width="80" height="60" fill="url(#darkFace)"/>
      <!-- gloss -->
      <ellipse cx="66" cy="62" rx="24" ry="12" fill="#FFFFFF" opacity="0.3"/>
      <ellipse cx="72" cy="160" rx="26" ry="10" fill="#5CC8E0" opacity="0.08"/>
    </g>
    <line x1="40" y1="110" x2="120" y2="110" stroke="#1B1F26" stroke-width="7"/>
    <rect x="40" y="50" width="80" height="120" rx="40" fill="none" stroke="#0B0E14" stroke-width="3" opacity="0.6"/>

    <!-- visor + face -->
    <rect x="53" y="66" width="56" height="34" rx="15" fill="#101A26"/>
    <circle cx="68" cy="80" r="4.6" fill="#6EE7A8"/>
    <circle cx="96" cy="86" r="4.6" fill="#6EE7A8"/>
    <path d="M76 88 q6.5 7 13 -1" stroke="#6EE7A8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- price line -->
    <path d="M52 150 L68 136 L78 148 L104 124" stroke="#6EE7A8" stroke-width="5.5"
          fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)"/>
  </g>

  <!-- sparkle -->
  <path d="M143 48 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#5CC8E0"/>
</svg>
