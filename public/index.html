<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THESIS.LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark">&#9679;</span>
        <h1>THESIS.LOG</h1>
      </div>
      <div class="pulse-strip">
        <div class="pulse-line" id="pulseLine"></div>
        <span class="pulse-label" id="pulseLabel">next scan &mdash;</span>
        <span class="live-dot"></span>
      </div>
    </header>

    <main class="layout">
      <aside class="vitals">
        <div class="vital-block">
          <div class="vital-label">wallet</div>
          <a class="vital-mono" id="walletLink" href="#" target="_blank" rel="noopener">&mdash;</a>
        </div>
        <div class="vital-block">
          <div class="vital-label">sol balance</div>
          <div class="vital-value" id="solBalance">&mdash;</div>
        </div>
        <div class="vital-block">
          <div class="vital-label">today's realized p&amp;l</div>
          <div class="vital-value" id="todaysPnl">&mdash;</div>
        </div>
        <div class="vital-block">
          <div class="vital-label">open positions</div>
          <div class="vital-value" id="openPositions">&mdash;</div>
        </div>
        <div class="vital-block">
          <div class="vital-label">kill switch</div>
          <div class="vital-value" id="killSwitch">&mdash;</div>
        </div>

        <div class="vital-rules">
          <div class="rule-row"><span>max position</span><span id="ruleMaxPos">&mdash;</span></div>
          <div class="rule-row"><span>stop-loss</span><span id="ruleStopLoss">&mdash;</span></div>
          <div class="rule-row"><span>daily loss limit</span><span id="ruleDailyLoss">&mdash;</span></div>
        </div>

        <div class="positions-block">
          <div class="vital-label">open now</div>
          <ul id="positionsList" class="positions-list">
            <li class="empty-note">none open</li>
          </ul>
        </div>

        <div class="positions-block">
          <div class="vital-label">scanning</div>
          <div class="rule-row"><span>tracked</span><span id="scanTracked">&mdash;</span></div>
          <div class="rule-row"><span>closest to $10k</span><span id="scanClosest">&mdash;</span></div>
          <div class="rule-row"><span>creates seen</span><span id="scanCreates">&mdash;</span></div>
          <div class="rule-row"><span>trades sampled</span><span id="scanTrades">&mdash;</span></div>
        </div>
      </aside>

      <section class="journal">
        <div class="empty-note journal-empty" id="journalEmpty">No entries yet. The bot is watching.</div>
        <ol class="journal-list" id="journalList"></ol>

        <div class="vital-label" style="margin: 28px 0 10px;">system logs</div>
        <div class="logs-box" id="logsBox"></div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
